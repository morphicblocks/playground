# Serves the assembled playground: the gallery at `/` and each ready app at
# `/<id>/`.
#
# Plain HTTP on port 80, on purpose. Traefik terminates TLS: the browser
# connects to Traefik over 443, and Traefik forwards a plain request to this
# container over the private Docker network. The certificate, its renewal and
# the public hostname all live in Traefik, so this server needs no 443
# listener and no certificate of its own.
#
# Astro writes each page as `<page>/index.html`, which the `index` directive
# resolves, so no rewrite rules are needed. The apps are plain static bundles
# and are served the same way.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Asset filenames contain a content hash, so a given URL never changes.
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The gallery ships no 404 page yet. Once `gallery/src/pages/404.astro`
    # exists, add:
    #     error_page 404 /404.html;
    # Pointing at a missing file would leave nginx with nothing to serve.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
