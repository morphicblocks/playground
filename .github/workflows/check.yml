name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Node and Chrome come with the runner. An app that uses pnpm, Yarn or
      # Deno needs that package manager set up here first.
      - run: bun install --frozen-lockfile
      # Builds the gallery and every app, then fails on any external request.
      - run: bun run check
