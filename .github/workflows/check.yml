name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Node, npm and Chrome come with the runner; apps may also use pnpm,
      # Yarn and Deno.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install -g pnpm yarn
      - run: bun install --frozen-lockfile
      # Builds the gallery and every app, then fails on any external request.
      - run: bun run check
