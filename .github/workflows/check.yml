name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Node, npm and Chrome come with the runner; apps may also use pnpm. An
      # app that uses Yarn or Deno needs that tool set up here first.
      - run: npm install -g pnpm
      - run: bun install --frozen-lockfile
      # Builds the gallery and every app, then fails on any external request.
      - run: bun run check
