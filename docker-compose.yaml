# Base stack: builds the playground and serves it with nginx.
#
# This file on its own runs anywhere, including a laptop with no Traefik:
#
#     docker compose up -d --build        # then http://localhost:9352
#
# It builds the same image that gets deployed, so it is the way to check a
# change locally before it goes to the server.
#
# Deploying behind Traefik layers the second file on top, which adds the
# router labels and the external network:
#
#     docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
#
# Only values that differ per host live in `.env`, the same file the build
# reads. Everything that is the same for anyone who clones this repo is
# written here directly. See `.env.example`.

services:
  web:
    build:
      context: .
      args:
        # Only needed when the build host reaches the internet through a
        # proxy. Empty otherwise, which is the common case.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: morphicblocks-playground-i
    container_name: morphicblocks-playground-c
    restart: unless-stopped
    # Loopback only: for reaching the container from the host itself, locally
    # or when debugging on the server. Public traffic arrives through Traefik
    # instead, over the Docker network. The landing and docs stacks use 9350
    # and 9351 so all three can run side by side.
    ports:
      - "127.0.0.1:9352:80"
    # Serving static files needs very little; the cap is here to keep one
    # container from starving the others on a shared host.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
